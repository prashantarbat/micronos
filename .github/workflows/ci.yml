name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, sqlite3, pdo_sqlite, curl, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --no-coverage

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, sqlite3, pdo_sqlite, curl, sodium
          coverage: none
      - name: PHP syntax
        run: find app system tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Shell scripts (shellcheck, errors)
        run: |
          shellcheck --severity=error system/micron-banner system/micron-network system/micron-ready-beep \
            system/numlock.sh system/micron-menu.sh system/micron-prompt.sh bin/micron-menu \
            installer/install.sh installer/micron-healthcheck installer/micron-slot installer/micron-slot-rescue \
            packaging/live-build/stage-overlay.sh packaging/rebuild_iso.sh packaging/finalize_iso.sh \
            packaging/live-build/config/hooks/live/*.hook.chroot
      - name: Python (ruff)
        run: pipx run ruff check system bin tools installer tests
      - run: composer install --no-interaction --prefer-dist
      - name: PHPStan (level 5, report only until the baseline is fixed)
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=1G

  daemon-and-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Several harnesses drive bin/microctl and php spark, so PHP is needed here too.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, sqlite3, pdo_sqlite, curl, sodium
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: composer install --no-interaction --prefer-dist
      - name: Daemon harnesses
        # The daemon runs as root on the appliance; its harnesses create
        # sockets, users and files that need root too.
        run: |
          failed=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            if ! sudo -E env "PATH=$PATH" python3 "$t" > /tmp/out.txt 2>&1; then
              failed=1
              echo "::error title=$t::$(grep -v -i '^ *\(ok\|pass\)' /tmp/out.txt | tail -n 40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            fi
            cat /tmp/out.txt
            echo "::endgroup::"
          done
          exit $failed
      - name: Installer and console tests
        run: |
          failed=0
          for t in tests/installer/*.sh; do
            echo "::group::$t"
            if ! sudo -E env "PATH=$PATH" bash "$t" > /tmp/out.txt 2>&1; then
              failed=1
              # Surface the tail as an annotation so it is readable without the log.
              echo "::error title=$t::$(grep -v '^  ok' /tmp/out.txt | tail -n 40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            fi
            cat /tmp/out.txt
            echo "::endgroup::"
          done
          exit $failed
