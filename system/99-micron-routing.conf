# Micron OS Kernel Forwarding and Routing Configuration (IPv4).
# IPv6 is governed by 60-micron-ipv6.conf (the IPv6 master switch); IPv6
# forwarding and router-advertisement handling are set by the network plan
# only when IPv6 is enabled.
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv4.conf.default.forwarding = 1
