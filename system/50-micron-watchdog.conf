# ==============================================================================
# Micron OS — Systemd Global Watchdog & Service Resilience Configuration
# ==============================================================================
# Installed to /etc/systemd/system.conf.d/50-micron-watchdog.conf
# Configures systemd's hardware watchdog driver, reboot watchdog, and default
# execution timeouts across all units to prevent hung services from blocking
# operations or leaving an appliance unreachable.
# ==============================================================================

[Manager]
# Hardware / Softdog Watchdog Integration
# Systemd will ping /dev/watchdog every 7.5 seconds (half RuntimeWatchdogSec).
# If the kernel hangs, lockups, or systemd fails to pet the dog, the hardware
# automatically hard-resets the system within 15 seconds.
RuntimeWatchdogSec=15s
RebootWatchdogSec=60s
KExecWatchdogSec=60s

# Service Start & Stop Safety Bounds
# Default maximum time a service is permitted to block during startup/shutdown.
# Prevents a misbehaving daemon from causing the appliance to hang indefinitely
# during reboot or shutdown commands.
DefaultTimeoutStartSec=30s
DefaultTimeoutStopSec=15s

# Service Restart Throttling
DefaultRestartSec=2s

# Resource Limits
DefaultLimitNOFILE=65536:524288
DefaultTasksMax=8192
