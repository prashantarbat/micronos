# ==============================================================================
# Micron OS — Kernel, Memory, and Network Resilience Configuration
# ==============================================================================
# Installed to /etc/sysctl.d/50-micron-resilience.conf
# Loaded at boot by systemd-sysctl.service to ensure appliance-grade stability,
# zero-hang recovery on hardware/kernel faults, OOM resilience, and protection
# against connection exhaustion and network flood attacks.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Kernel Panic, Oops, and Hardware Hang Recovery
# ------------------------------------------------------------------------------
# In an edge router/firewall appliance, hanging indefinitely on a panic or
# lockup is unacceptable — it causes total branch isolation until someone power-cycles.
# Instead, automatically reboot cleanly after 10 seconds.
kernel.panic = 10
kernel.panic_on_oops = 1
kernel.panic_on_warn = 0

# Reboot on CPU deadlocks / softlockups
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1

# Detect unkillable uninterruptible sleep (D-state) I/O hangs
kernel.hung_task_timeout_secs = 60
kernel.hung_task_panic = 1

# Magic SysRq key: enable sync, unmount, reboot, and term/kill (0x8e = 142)
kernel.sysrq = 142

# ------------------------------------------------------------------------------
# 2. Virtual Memory (VM) & OOM Killer Hardening
# ------------------------------------------------------------------------------
# Routers must never swap or stall on memory allocation:
# Prefer RAM, keep swappiness near zero if swap exists.
vm.swappiness = 10

# Keep minimum 64MB of free memory reserved for kernel networking ring-buffers
# and atomic interrupt allocations under heavy traffic bursts.
vm.min_free_kbytes = 65536

# Reduce dirty page buffer cache writeback latency to prevent burst I/O stalls
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# ------------------------------------------------------------------------------
# 3. Stateful Connection Tracking (nf_conntrack) Resilience
# ------------------------------------------------------------------------------
# Scale maximum concurrent stateful connection entries to 524,288.
net.netfilter.nf_conntrack_max = 524288

# Reclaim dead established connections in 2 hours instead of the default 5 days.
# Prevents state table exhaustion from abandoned TCP connections.
net.netfilter.nf_conntrack_tcp_timeout_established = 7200

# Aggressive reclamation of closing TCP states
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 30
net.netfilter.nf_conntrack_generic_timeout = 120

# ------------------------------------------------------------------------------
# 4. TCP/IP Stack & Ingress Queue Hardening
# ------------------------------------------------------------------------------
# SYN cookies for SYN flood mitigation
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_synack_retries = 2

# Fast socket teardown & high socket listen backlogs
net.ipv4.tcp_fin_timeout = 15
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 10000

# TCP window scaling and selective ACKs
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1

# Buffer sizing for gigabit/multi-gigabit network interfaces
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# ------------------------------------------------------------------------------
# 5. Network Security, Anti-Spoofing & ICMP Hygiene
# ------------------------------------------------------------------------------
# Strict Reverse Path Filtering (prevents IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Refuse source-routed packets (strict routing path verification)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Ignore ICMP redirects (prevents rogue router advertisement and MITM)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Do not send ICMP redirects as a security gateway
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Smurf attack protection (ignore ICMP echo requests to broadcast addresses)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Log martian/impossible packets for security audit
net.ipv4.conf.all.log_martians = 0
net.ipv4.conf.default.log_martians = 0
