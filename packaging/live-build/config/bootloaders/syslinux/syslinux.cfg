ui vesamenu.c32
prompt 0
timeout 50
totaltimeout 300

menu title Micron OS Installer & Appliance Boot Menu
menu background splash.png
menu color title    1;36;40    #00ffff #000000 none
menu color sel      7;37;44    #ffffff #0055aa std
menu color hotsel   1;7;37;44  #ffffff #0055aa std

# Clean layout geometry preventing any text overlap
menu width 72
menu margin 4
menu vshift 8
menu rows 8
menu tabmsgrow 19
menu cmdlinerow 20
menu timeoutrow 21
menu helpmsgrow 22

label install
    menu label ^Install Micron OS (Interactive Guided Installer)
    menu default
    kernel /live/vmlinuz
    append initrd=/live/initrd.img boot=live components micron.installer=1 username=ministrator user-fullname=Ministrator hostname=micron-os

label autoinstall
    menu label Install Micron OS (^Automated Kickstart / Unattended)
    kernel /live/vmlinuz
    append initrd=/live/initrd.img boot=live components micron.installer=1 micron.autoinstall=1 username=ministrator user-fullname=Ministrator hostname=micron-os

label rescue
    menu label Micron OS ^Emergency Slot Recovery (Switch Slot A/B)
    kernel /live/vmlinuz
    append initrd=/live/initrd.img boot=live components micron.slot_rescue=1 username=ministrator user-fullname=Ministrator hostname=micron-os

label live
    menu label Micron OS ^Live Appliance Console (Rescue Mode)
    kernel /live/vmlinuz
    append initrd=/live/initrd.img boot=live components quiet username=ministrator user-fullname=Ministrator hostname=micron-os

label failsafe
    menu label Micron OS (^Safe Graphics / Nomodeset)
    kernel /live/vmlinuz
    append initrd=/live/initrd.img boot=live components nomodeset username=ministrator user-fullname=Ministrator hostname=micron-os

label serial
    menu label Micron OS (^Serial Console 115200)
    kernel /live/vmlinuz
    append initrd=/live/initrd.img boot=live components console=tty0 console=ttyS0,115200 username=ministrator user-fullname=Ministrator hostname=micron-os
