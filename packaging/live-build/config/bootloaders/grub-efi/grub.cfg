set default=0
set timeout=5

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod all_video
fi

insmod gfxterm
insmod png

terminal_input console
terminal_output gfxterm

set menu_color_normal=cyan/black
set menu_color_highlight=white/blue

menuentry "Install Micron OS (Interactive Guided Installer)" --class os {
    linux /live/vmlinuz boot=live components micron.installer=1 username=ministrator user-fullname=Ministrator hostname=micron-os
    initrd /live/initrd.img
}

menuentry "Install Micron OS (Automated Kickstart / Unattended)" --class os {
    linux /live/vmlinuz boot=live components micron.installer=1 micron.autoinstall=1 username=ministrator user-fullname=Ministrator hostname=micron-os
    initrd /live/initrd.img
}

menuentry "Micron OS Emergency Slot Recovery (Switch Slot A/B)" --class os {
    linux /live/vmlinuz boot=live components micron.slot_rescue=1 username=ministrator user-fullname=Ministrator hostname=micron-os
    initrd /live/initrd.img
}

menuentry "Micron OS Live Appliance Console (Rescue Mode)" --class os {
    linux /live/vmlinuz boot=live components quiet username=ministrator user-fullname=Ministrator hostname=micron-os
    initrd /live/initrd.img
}

menuentry "Micron OS (Safe Graphics / Failsafe)" --class os {
    linux /live/vmlinuz boot=live components nomodeset username=ministrator user-fullname=Ministrator hostname=micron-os
    initrd /live/initrd.img
}

menuentry "Micron OS (Serial Console ttyS0 115200)" --class os {
    linux /live/vmlinuz boot=live components console=tty0 console=ttyS0,115200 username=ministrator user-fullname=Ministrator hostname=micron-os
    initrd /live/initrd.img
}
